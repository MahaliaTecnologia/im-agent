# Workflow de referência para o repositório do im-agent (GitHub, fora deste projeto).
# Copie para .github/workflows/publicar-insightmanager.yml no repositório do agente.
#
# Segredo necessário no repositório (Settings → Secrets and variables → Actions):
#   AGENT_RELEASE_TOKEN — mesmo valor salvo neste projeto (InsightManager).
#
# Dispara ao criar uma tag vX.Y.Z. Os binários devem estar em dist/ com os nomes
# im-agent-<os>-<arch>[.exe] e o manifesto em dist/manifesto.json (versao + sha256
# de cada um dos 6 binários). Tudo é idempotente: o job pode ser repetido inteiro.

name: Publicar versão no InsightManager

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ajuste para o build real do agente (Go): deve produzir os 6 binários e
      # dist/manifesto.json com { "versao": "X.Y.Z", "binarios": { "<os>-<arch>":
      # { "arquivo": "...", "sha256": "...", "assinatura": "" } } }.
      - name: Build dos binários e manifesto
        run: |
          echo "TODO: build do im-agent para as 6 plataformas em dist/"
          exit 1

      - name: Registrar versão
        env:
          AUTH: Authorization: Bearer ${{ secrets.AGENT_RELEASE_TOKEN }}
          BASE: https://insightmanager.com.br
        run: |
          V="${GITHUB_REF_NAME#v}"
          jq -n --arg v "$V" --arg c "$GITHUB_SHA" --slurpfile m dist/manifesto.json \
            '{versao:$v, tag:("v"+$v), commit:$c, manifesto:$m[0]}' \
          | curl -fsS -X POST "$BASE/api/public/agent-releases" -H "$AUTH" \
              -H "Content-Type: application/json" --data-binary @-

      - name: Enviar binários
        env:
          AUTH: Authorization: Bearer ${{ secrets.AGENT_RELEASE_TOKEN }}
          BASE: https://insightmanager.com.br
        run: |
          V="${GITHUB_REF_NAME#v}"
          for f in im-agent-linux-amd64 im-agent-linux-arm64 \
                   im-agent-darwin-amd64 im-agent-darwin-arm64 \
                   im-agent-windows-amd64.exe im-agent-windows-arm64.exe; do
            curl -fsS -X PUT "$BASE/api/public/agent-releases/$V/$f" -H "$AUTH" \
              -H "Content-Type: application/octet-stream" --data-binary "@dist/$f"
          done

      - name: Concluir (entra em piloto por 24 h)
        env:
          AUTH: Authorization: Bearer ${{ secrets.AGENT_RELEASE_TOKEN }}
          BASE: https://insightmanager.com.br
        run: |
          V="${GITHUB_REF_NAME#v}"
          curl -fsS -X POST "$BASE/api/public/agent-releases/$V/concluir" -H "$AUTH"
