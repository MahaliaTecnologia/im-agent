name: build-e-release

# Testes em todo push/PR. Release (6 binários + manifesto.json + SHA256SUMS)
# automática quando chega na main um commit com uma versão nova em cmd/main.go:
# o próprio workflow cria a tag vX.Y.Z junto com a release. Não criar tags à mão.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Mesma versão usada nos binários publicados (compilação reproduzível).
          go-version: "1.24.7"
      - name: Confere dependências (go.sum)
        run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - name: Compila todos os sistemas
        run: ./build.sh

  # Decide se este push na main publica uma versão: só quando a tag vX.Y.Z
  # ainda não existe. Se ela já existe neste mesmo commit e o job está sendo
  # rodado de novo (Re-run), publica outra vez para completar um envio que falhou.
  versao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publicar: ${{ steps.decide.outputs.publicar }}
    steps:
      - uses: actions/checkout@v5
      - id: decide
        run: |
          v=$(sed -n 's/^const versao = "\(.*\)"/\1/p' cmd/main.go)
          [ -n "$v" ] || { echo "const versao não encontrada em cmd/main.go"; exit 1; }
          tag="v$v"
          git fetch -q --tags origin
          commit_da_tag=$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)
          if [ -z "$commit_da_tag" ]; then
            publicar=true; echo "Versão nova ${tag}: será publicada."
          elif [ "$commit_da_tag" = "$GITHUB_SHA" ] && [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            publicar=true; echo "Re-run de ${tag}: publica de novo."
          else
            publicar=false; echo "${tag} já publicada; nada a fazer."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"

  release:
    needs: [testes, versao]
    if: needs.versao.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    # Dois merges seguidos não publicam ao mesmo tempo.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ needs.versao.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.7"
      - name: Compila
        run: ./build.sh

      # --- Assinatura de código (ligar quando as contas existirem) ---------
      # Windows (Azure Trusted Signing): segredos AZURE_TENANT_ID, AZURE_CLIENT_ID,
      #   AZURE_CLIENT_SECRET, TS_ENDPOINT, TS_ACCOUNT, TS_PROFILE. Rodar num job
      #   windows-latest com azure/trusted-signing-action sobre dist/*.exe.
      # macOS (Developer ID + notarização): segredos MACOS_CERT_P12, MACOS_CERT_SENHA,
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SENHA. Rodar num job macos-latest:
      #   codesign --options runtime --timestamp -s "Developer ID Application: ..." e
      #   xcrun notarytool submit --wait (binários soltos são notarizados dentro de um .zip).
      # Depois de assinar, rodar de novo o cálculo de SHA-256 (o manifesto tem que
      # refletir o binário assinado). Nunca colocar certificados ou senhas no repositório.

      - name: Publica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rodar de novo (Re-run) não falha: se a release já existe, só
          # substitui os arquivos (o manifesto continua batendo com os binários).
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            exit 0
          fi
          # --target cria a tag neste commit (não existe tag manual).
          gh release create "${TAG}" dist/* --target "${GITHUB_SHA}" \
            --title "im-agent ${TAG}" \
            --notes "Binários, manifesto.json e SHA256SUMS. Enviada automaticamente ao InsightManager (piloto 24 h, depois liberada para todos)."

      # Envia ao InsightManager: entra em piloto e é liberada para todos em
      # 24 h se os pilotos atualizarem sem erro. Pausar/voltar versão na tela
      # "Versões do agente" do InsightManager (superadmin).
      - name: Envia ao InsightManager
        env:
          IM_RELEASE_TOKEN: ${{ secrets.IM_RELEASE_TOKEN }}
        run: ./scripts/publicar-insightmanager.sh
